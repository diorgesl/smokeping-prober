# Exemplo de config.yaml consumido pelo smokeping_prober.
# Copie para config.yaml e ajuste os targets (ou gerencie via smokeping-manager).
# Roteadores para ping remoto (opcional). O prober abre sessões SSH e roda
# "ping -a <source do link>" a partir de cada link. Os caminhos são vistos
# de dentro do container do prober (./config -> /etc/smokeping_prober).
routers:
  - name: ne8k
    address: 10.0.0.1:22
    username: smokeping
    password_file: /etc/smokeping_prober/ne8k.pass  # ou private_key_file
    known_hosts: /etc/smokeping_prober/known_hosts  # ou insecure_skip_host_key: true (só lab)
    sessions: 5
    links:
      - name: isp-a
        vpn_instance: upstream-1
        source: 192.0.2.1
        source6: 2001:db8::1
      - name: isp-b
        source: 198.51.100.1
targets:
  - host: "1.1.1.1"
    interval: 1s
    network: ip4
    protocol: icmp
    size: 56
    tos: 0x00
    labels:
      category: "DNS"
      menu: "Cloudflare 1"
      title: "Cloudflare 1 - 1.1.1.1"
      smokeping_name: "Cloudflare-1-v4"
      alerts_enabled: "true"
  - host: "8.8.8.8"
    interval: 1s
    network: ip4
    protocol: icmp
    size: 56
    tos: 0x00
    labels:
      category: "DNS"
      menu: "Google 1"
      title: "Google 1 - 8.8.8.8"
      smokeping_name: "Google-1-v4"
      alerts_enabled: "true"
  - host: "2606:4700:4700::1111"
    interval: 1s
    network: ip6
    protocol: icmp
    size: 56
    tos: 0x00
    labels:
      category: "DNS"
      menu: "Cloudflare 1 v6"
      title: "Cloudflare 1 - 2606:4700:4700::1111"
      smokeping_name: "Cloudflare-1-v6"
      alerts_enabled: "false"
  - host: "8.8.8.8"
    router: ne8k        # pingado pelo roteador, uma série por link (label link)
    interval: 1m
    network: ip4
    protocol: icmp
    size: 56
    tos: 0x00
    # count: 10         # pacotes por rodada (default 10)
    labels:
      category: "DNS"
      menu: "Google 1 via ne8k"
      title: "Google 1 - 8.8.8.8 via ne8k"
      smokeping_name: "Google-1-v4-ne8k"
      alerts_enabled: "true"
